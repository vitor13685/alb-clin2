<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALB CLIN - Aprendizagem e Desenvolvimento</title>
<style>
/* Escala tipográfica: 11 (rótulos) · 13 (apoio) · 14 (corpo) · 16 (títulos de bloco) · 20 (KPI) · 24 (título de página) */
:root{--bg:#f3f5f9;--fg:#18202f;--card:#fff;--primary:#475569;--pfg:#fff;--accent:#f2a84b;--border:#e2e7f0;--muted:#64748b;--soft:#f1f5fb;--red:#dc2626;--green:#15803d;--side:#1f2937;--sidefg:#cbd5e1;--shadow:0 1px 2px rgba(15,23,42,.05),0 2px 8px rgba(15,23,42,.04)}
body.dark{--bg:#0a0f1c;--fg:#e6ebf3;--card:#121a2c;--primary:#cbd5e1;--pfg:#0f172a;--accent:#f2a84b;--border:#22304a;--muted:#8fa0bb;--soft:#18223a;--red:#f87171;--green:#4ade80;--side:#070c17;--sidefg:#9fb0cb;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}
/* sidebar */
aside{background:var(--side);color:var(--sidefg);display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{background:#fdf6ea;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;height:120px;cursor:pointer;position:relative;transition:box-shadow .15s}
.brand .logo:hover{box-shadow:0 0 0 2px var(--accent)}
.brand .logo::after{content:"Clique para alterar";position:absolute;inset:auto 0 0 0;text-align:center;font-size:11px;font-weight:600;color:#fff;background:rgba(15,23,42,.72);padding:4px 0;opacity:0;transition:opacity .15s}
.brand .logo:hover::after{opacity:1}
.brand .logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand .logo .hint{display:none;color:var(--primary);font-weight:800;font-size:16px;text-align:center;line-height:1.2}
.brand .logo .hint small{display:block;font-size:11px;font-weight:600;color:#475569;margin-top:2px}
.grp{padding:14px 14px 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#7d8fb0;font-weight:700}
nav{display:flex;flex-direction:column;padding:0 8px 8px;gap:1px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--sidefg);text-decoration:none;font-weight:500;font-size:14px}
nav a .ic{width:18px;text-align:center;opacity:.8;font-size:13px}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a.on{background:var(--accent);color:#1a1a1a;font-weight:600}
body.dark nav a.on{color:#111}
.sidefoot{margin-top:auto;padding:12px 14px;font-size:11px;color:#7d8fb0;border-top:1px solid rgba(255,255,255,.08)}
.sidefoot b{color:#e2e8f0;font-weight:600}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
header.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
header.top .crumb{font-size:13px;color:var(--muted);white-space:nowrap}
header.top .search{flex:1;max-width:420px;margin-left:auto;position:relative}
header.top .search input{width:100%;padding-left:12px}
.menuwrap{position:relative}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:280px;box-shadow:0 14px 36px rgba(15,23,42,.18);z-index:20;flex-direction:column}
.menu.open{display:flex}
.menu button,.menu label{background:none;border:0;color:var(--fg);text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:14px}
.menu button:hover,.menu label:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.content{flex:1;overflow:auto;padding:20px 24px 28px}
footer{margin-top:28px;border-top:1px solid var(--border);padding-top:12px;text-align:center;color:var(--muted);font-size:12px}
footer b{color:var(--fg);font-weight:600}
/* tipografia */
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 16px}
h2{font-size:16px;font-weight:700;margin:0 0 10px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.spacer{flex:1}
/* blocos */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.kpi{position:relative;padding:12px 14px 12px 18px;margin:0}
.kpi::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.kpi .v{display:block;font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .hint{color:var(--muted);font-size:12px}
.kpi.alert .v{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
@media(max-width:1100px){.cols2{grid-template-columns:1fr}}
/* botões e campos */
.btn{background:var(--primary);color:var(--pfg);border:1px solid transparent;border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:var(--card);color:var(--fg);border-color:var(--border)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:rgba(220,38,38,.08);filter:none}
.btn.on{background:var(--primary);color:var(--pfg)}
.btn.icon{padding:4px 8px}
input,select,textarea{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font:inherit;font-size:13px;min-height:34px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
/* tabelas */
.tablewrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:auto;box-shadow:var(--shadow);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--soft);font-weight:700;white-space:nowrap}
tbody tr:hover td{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{white-space:nowrap;text-align:right}
.acts .btn{margin-left:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
.strong{font-weight:700}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
/* cards de registro */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.rcard h3{margin:0;font-size:15px;font-weight:700}
.rcard .meta{font-size:13px;color:var(--muted)}
.rcard .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.ok{background:#e7f6ec;color:#166534}
.tag.warn{background:#fdf0dc;color:#9a5b00}
.tag.bad{background:#fdecec;color:#991b1b}
.tag.info{background:#e6eefb;color:#1b3b6f}
body.dark .tag.info{background:#1b2a48;color:#9ec1ff}
body.dark .tag.ok{background:#14301f;color:#86efac}
body.dark .tag.warn{background:#33250e;color:#fcd34d}
body.dark .tag.bad{background:#3a1717;color:#fca5a5}
.alert{display:flex;align-items:center;gap:10px;background:rgba(245,169,74,.13);border:1px solid rgba(245,169,74,.55);padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px}
.alert.red{background:rgba(220,38,38,.07);border-color:rgba(220,38,38,.45)}
.alert .go{margin-left:auto}
.bar{display:flex;align-items:flex-end;gap:3px;height:180px;border-bottom:1px solid var(--border)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:8px 0;font-size:13px}
.prow:last-child{border-bottom:0}
.note{white-space:pre-wrap;font-size:13px;line-height:1.55}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
.kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.kv .v{font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
/* modais */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.open{display:flex}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(15,23,42,.3)}
.box.wide{width:min(820px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.form input,.form select,.form textarea{text-transform:none;font-size:13px;letter-spacing:0;font-weight:400}
.form textarea{min-height:84px;resize:vertical;font-family:inherit}
.form .full{grid-column:1/-1}
.checks{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:none;color:var(--fg);font-weight:500}
.hist{max-height:60vh;overflow:auto}
.hitem{border-left:2px solid var(--accent);padding:6px 0 8px 12px;margin-bottom:6px}
.hitem .when{font-size:12px;color:var(--muted)}
.hitem .chg{font-size:12px;margin-top:3px}
.hitem .chg span{display:inline-block;margin-right:10px}
.hitem s{color:var(--red)}
.hitem em{font-style:normal;color:var(--green)}
@media print{aside,header.top,footer,.noprint{display:none!important}.app{display:block;height:auto}.content{overflow:visible;padding:0}body{background:#fff;color:#000}.card,.panel,.tablewrap,.rcard{box-shadow:none;border-color:#bbb}}
@media(max-width:820px){.app{grid-template-columns:1fr;height:auto;overflow:visible}aside{position:static}.content{overflow:visible}.form{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo" id="logoBox">
        <img id="logoImg" src="alb-clin-logo.png" alt="Logotipo ALB CLIN" onerror="logoMissing()">
        <div class="hint" id="logoHint">ALB CLIN<small>Aprendizagem e Desenvolvimento</small></div>
      </div>
    </div>
    <div class="grp">Principal</div>
    <nav id="nav1"></nav>
    <div class="grp">Clínica</div>
    <nav id="nav2"></nav>
    <div class="grp">Financeiro</div>
    <nav id="nav3"></nav>
    <div class="grp">Sistema</div>
    <nav id="nav4"></nav>
    <div class="sidefoot">Aplicativo desenvolvido por<br><b>Vitor Hugo Callegari de Oliveira</b></div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <div class="search noprint"><input id="gsearch" placeholder="Buscar paciente, doutora, convênio…" oninput="globalSearch(this.value)"></div>
      <div class="menuwrap noprint">
        <button class="btn ghost sm" id="menuBtn">⋯ Opções</button>
        <div class="menu" id="menu">
          <button data-m="theme" id="themeBtn">Tema escuro</button>
          <button data-m="fs" id="fsBtn">Tela cheia</button>
          <button data-m="print">Imprimir esta tela</button>
          <button data-m="xls">Exportar backup (Excel / Sheets)</button>
          <label>Importar backup (.xls)<input type="file" id="impFile" accept=".xls,.xml" hidden></label>
          <hr>
          <button data-m="sample">Carregar dados de exemplo</button>
          <button data-m="clear">Apagar todos os dados</button>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>


<input type="file" id="logoFile" accept="image/*" hidden>

<div class="modal" id="modal"><div class="box">
  <div class="mhead"><h2 id="mTitle" style="margin:0"></h2><button class="btn ghost sm" id="mClose" type="button">Fechar ✕</button></div>
  <form id="mForm" class="form"></form>
</div></div>

<div class="modal" id="hmodal"><div class="box wide">
  <div class="mhead"><h2 id="hTitle" style="margin:0"></h2><button class="btn ghost sm" data-hclose type="button">Fechar ✕</button></div>
  <div class="hist" id="hBody"></div>
</div></div>

<script>
/* ============ utilitários ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtD = s => (s ? s.split('-').reverse().join('/') : '');
const fmtTS = iso => new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const addDays = (iso, n) => { const x = new Date(iso + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const YEARS = [0,1,2,3,4].map(i => new Date().getFullYear() - 2 + i);
const SERVICES = ['Psicoterapia','ABA','Seminário','Avaliação','Neuropsicologia','Psicoterapia de casal','Orientação parental'];
const STATUS = ['agendado','confirmado','realizado','faltou','cancelado'];
const PSTATUS = ['ativo','pausa','alta'];
const PAY = [{value:'convenio',label:'Convênio'},{value:'particular',label:'Particular'}];
const CATS = ['Consultas particulares','Repasse de convênio','Sessões ABA','Venda de produtos','Estorno','Reembolso recebido','Aluguel','Condomínio','Energia','Água','Internet','Telefone','Salários','Pró-labore','Comissões','INSS/FGTS','Contabilidade','Impostos','Marketing','Transporte','Manutenção','Equipamentos','Material terapêutico','Material de escritório','Insumos de limpeza','Copa','Software / sistemas','Cursos e supervisão','Outros'];
const SUP_CATS = ['Limpeza','Higiene','Escritório','Material terapêutico','Copa','Outros'];
const ENTLABEL = { professionals:'Doutora', patients:'Paciente', appointments:'Atendimento', insurers:'Convênio', guides:'Guia', evolutions:'Evolução', cash:'Lançamento', supplies:'Insumo', movements:'Movimentação', waitlist:'Lista de espera', invoices:'Nota fiscal' };
const FIELDLABEL = { name:'nome', specialty:'especialidade', crp:'CRP', phone:'telefone', email:'e-mail', weekdays:'dias', commission:'repasse', active:'disponível', cpf:'CPF', birth:'nascimento', responsible:'responsável', payer_type:'tipo', insurer:'convênio', card_number:'carteirinha', session_value:'valor da sessão', professional_name:'doutora', status:'status', consent:'termo', anamnese:'anamnese', notes:'observações', date:'data', time:'horário', patient_name:'paciente', professional_id:'doutora', service:'atendimento', value:'valor', guide_number:'guia', number:'nº', validity:'validade', authorized:'sessões autorizadas', text:'registro', type:'tipo', description:'descrição', category:'categoria', amount:'valor', payment_method:'forma', due_date:'vencimento', payer:'pagador', deadline_days:'prazo (dias)', contact:'contato', unit:'unidade', quantity:'quantidade', min_quantity:'mínimo', unit_cost:'custo unitário', supplier:'fornecedor', preference:'preferência', address:'endereço', fee:'taxa', cnpj:'CNPJ', clinicName:'clínica' };

const SCHEMA = {
  professionals: { sheet: 'Doutoras', cols: ['id','name','specialty','crp','phone','email','weekdays','commission','active'], num: ['commission'], bool: ['active'] },
  patients: { sheet: 'Pacientes', cols: ['id','name','cpf','birth','phone','email','responsible','payer_type','insurer','card_number','session_value','professional_name','status','consent','anamnese','notes'], num: ['session_value'], bool: ['consent'] },
  appointments: { sheet: 'Agenda', cols: ['id','date','time','patient_name','professional_id','professional_name','service','payer_type','insurer','guide_number','value','status','notes'], num: ['value'] },
  insurers: { sheet: 'Convenios', cols: ['id','name','deadline_days','contact'], num: ['deadline_days'] },
  guides: { sheet: 'Guias', cols: ['id','number','patient_name','insurer','date','validity','authorized','notes'], num: ['authorized'] },
  evolutions: { sheet: 'Evolucoes', cols: ['id','patient_id','patient_name','date','professional_name','text'], num: [] },
  cash: { sheet: 'Caixa', cols: ['id','type','status','date','due_date','category','description','payer','amount','payment_method'], num: ['amount'] },
  supplies: { sheet: 'Insumos', cols: ['id','name','category','unit','quantity','min_quantity','unit_cost','supplier'], num: ['quantity','min_quantity','unit_cost'] },
  movements: { sheet: 'Movimentacoes', cols: ['id','supply_id','supply_name','type','quantity','date','note'], num: ['quantity'] },
  waitlist: { sheet: 'ListaEspera', cols: ['id','name','phone','professional_id','preference','date','notes'], num: [] },
  invoices: { sheet: 'NotasFiscais', cols: ['id','tipo','numero','serie','chave','emissao','parte','documento','valor','impostos','categoria','status','anexo_nome','observacoes'], num: ['valor','impostos'] },
  audit: { sheet: 'Historico', cols: ['id','ts','ent','rid','label','action','changes'], num: [] }
};
const ENT = Object.keys(SCHEMA).filter(k => k !== 'audit');

let DB = {};
const emptyDB = () => { const o = {}; ENT.forEach(e => o[e] = []); o.audit = []; o.settings = { clinicName: 'ALB CLIN – Aprendizagem e Desenvolvimento', cnpj: '00.000.000/0001-00', address: 'Rua Exemplo, 123 · São Paulo/SP', fee: 8 }; return o; };
DB = emptyDB();

const NAV = [
  ['painel','Painel','◉',1],['agenda','Agenda','▦',1],['espera','Lista de espera','⏳',1],
  ['pacientes','Pacientes','👥',2],['doutoras','Doutoras','✚',2],['convenios','Convênios e guias','▤',2],
  ['caixa','Caixa e contas','$',3],['repasse','Repasses','⇄',3],['insumos','Insumos','▣',3],['notas','Notas fiscais','🧾',3],
  ['historico','Histórico','↺',4],['config','Configurações','⚙',4]
];
const TITLE = Object.fromEntries(NAV.map(([k, l]) => [k, l]));
let cur = 'painel', agendaDay = today(), caixaType = 'all', FICHA = null, FTAB = 'dados', NOTICE = null, HQ = { ent: 'all', q: '' }, LOGO = 'file', NF = { tipo: 'all', st: 'all' };
const F = { year: new Date().getFullYear(), month: new Date().getMonth(), prof: 'all', payer: 'all' };
const feeRate = () => (DB.settings.fee || 0) / 100;

const inP = d => !!d && +d.slice(0,4) === F.year && (F.month < 0 || +d.slice(5,7) - 1 === F.month);
const stock = s => (s.quantity || 0) <= 0 ? 'zerado' : (s.quantity || 0) <= (s.min_quantity || 0) ? 'baixo' : 'ok';
function stockAlert(s, nq) {
  const st = stock({ ...s, quantity: nq });
  if (st === 'zerado') return `${s.name} está zerado. Repor o quanto antes.`;
  if (st === 'baixo') return `${s.name} abaixo do mínimo: restam ${nq} ${s.unit || ''} (mínimo ${s.min_quantity || 0}).`;
  return '';
}
function summ(list) {
  const done = list.filter(a => a.status === 'realizado');
  const sum = arr => arr.reduce((t, a) => t + (a.value || 0), 0);
  const conv = done.filter(a => a.payer_type !== 'particular');
  const tb = sum(conv), fee = tb * feeRate(), tl = tb - fee, pc = sum(done.filter(a => a.payer_type === 'particular'));
  return { tb, fee, tl, pc, aba: sum(conv.filter(a => a.service === 'ABA')), total: tl + pc, sessions: done.length, absences: list.filter(a => a.status === 'faltou').length };
}
const guideUse = g => DB.appointments.filter(a => a.guide_number && a.guide_number === g.number && a.status === 'realizado').length;
function cashList() {
  const sess = DB.appointments.filter(a => a.status === 'realizado' && inP(a.date)).map(a => ({

    description: `Sessão · ${a.patient_name}${a.professional_name ? ' · ' + a.professional_name : ''}`, amount: a.value || 0, payment_method: a.payer_type === 'particular' ? 'Particular' : 'Convênio'
  }));
  return [...sess, ...DB.cash.filter(c => inP(c.date))].sort((a, b) => b.date.localeCompare(a.date));
}
const byId = (ent, id) => DB[ent].find(r => r.id === id);
const labelOf = (ent, r) => r.name || r.number || (r.numero ? 'NF ' + r.numero + (r.parte ? ' · ' + r.parte : '') : '') || r.patient_name || r.supply_name || r.description || r.category || r.text?.slice(0, 40) || r.id;

/* ============ histórico (auditoria) ============ */
function audit(ent, action, rec, changes = []) {
  DB.audit.unshift({ id: uid(), ts: new Date().toISOString(), ent, rid: rec.id, label: labelOf(ent, rec), action, changes });
}
function diffs(oldR, newR) {
  const keys = new Set([...Object.keys(oldR), ...Object.keys(newR)]); keys.delete('id'); keys.delete('_appt');
  const out = [];
  keys.forEach(k => {
    const isFile = k === 'file';
    const a = String((isFile ? oldR.file?.name : oldR[k]) ?? ''), b = String((isFile ? newR.file?.name : newR[k]) ?? '');
    if (a !== b) out.push({ field: isFile ? 'anexo' : (FIELDLABEL[k] || k), from: a, to: b });
  });
  return out;
}
function save(ent, rec, quiet) {
  if (rec.id) {
    const i = DB[ent].findIndex(r => r.id === rec.id);
    if (i >= 0) {
      const ch = diffs(DB[ent][i], rec);
      DB[ent][i] = rec;
      if (ch.length && !quiet) audit(ent, 'Editado', rec, ch);
      return rec;
    }
  }
  const nr = { ...rec, id: uid() };
  DB[ent].push(nr);
  if (!quiet) audit(ent, 'Criado', nr);
  return nr;
}
function removeRec(ent, id) {
  const r = byId(ent, id); if (!r) return;
  DB[ent] = DB[ent].filter(x => x.id !== id);
  audit(ent, 'Excluído', r);
}
function histOf(ent, id) { return DB.audit.filter(h => h.rid === id); }
function openHist(ent, id) {
  const r = byId(ent, id); const list = histOf(ent, id);
  $('#hTitle').textContent = `Histórico · ${ENTLABEL[ent] || ''} ${labelOf(ent, r || { id })}`;
  $('#hBody').innerHTML = list.map(renderHItem).join('') || '<div class="muted">Sem registros de alteração.</div>';
  $('#hmodal').classList.add('open');
}
function renderHItem(h) {
  const ch = (h.changes || []).map(c => `<div class="chg"><b>${esc(c.field)}</b>: <s>${esc(c.from || '—')}</s> → <em>${esc(c.to || '—')}</em></div>`).join('');
  const tag = h.action === 'Criado' ? 'ok' : h.action === 'Excluído' ? 'bad' : 'info';
  return `<div class="hitem"><div class="when">${fmtTS(h.ts)} · <span class="tag ${tag}">${esc(h.action)}</span> · ${esc(ENTLABEL[h.ent] || h.ent)} · ${esc(h.label)}</div>${ch}</div>`;
}

/* ============ formulários ============ */
function openForm(title, fields, init, onSave, hook) {
  const f = $('#mForm'); init = init || {};
  $('#mTitle').textContent = title;
  f.innerHTML = fields.map(fd => {
    const v = init[fd.name] ?? '';
    let inp;
    if (fd.type === 'select') inp = `<select name="${fd.name}"><option value="">Selecione</option>${fd.options.map(o => { const val = typeof o === 'string' ? o : o.value, lab = typeof o === 'string' ? o : o.label; return `<option value="${esc(val)}"${String(v) === String(val) ? ' selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
    else if (fd.type === 'file') inp = `<input type="file" name="${fd.name}" accept="${esc(fd.accept || '')}">${v && v.name ? `<span class="muted small" style="text-transform:none;letter-spacing:0">Anexo atual: ${esc(v.name)} · deixe em branco para manter</span>` : ''}`;
    else if (fd.type === 'textarea') inp = `<textarea name="${fd.name}">${esc(v)}</textarea>`;
    else inp = `<input name="${fd.name}" type="${fd.type || 'text'}"${fd.type === 'number' ? ' step="0.01"' : ''}${fd.required ? ' required' : ''} value="${esc(v)}">`;
    return `<label class="${fd.full ? 'full' : ''}">${fd.label}${inp}</label>`;
  }).join('') + `<div class="full row" style="justify-content:flex-end;margin:6px 0 0"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div>`;
  f.onchange = e => {
    if (!hook || !e.target.name) return;
    const patch = hook(e.target.name, Object.fromEntries(new FormData(f))) || {};
    for (const k in patch) { const el = f.elements[k]; if (el && patch[k] !== undefined) el.value = patch[k]; }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    fields.forEach(fd => { if (fd.type === 'number') d[fd.name] = d[fd.name] === '' ? undefined : Number(d[fd.name]); });
    for (const fd of fields.filter(x => x.type === 'file')) {
      const file = d[fd.name]; delete d[fd.name];
      if (file && file.size) {
        if (file.size > 3 * 1024 * 1024) { alert('Arquivo acima de 3 MB. Reduza o arquivo e tente novamente.'); return; }
        d.file = { name: file.name, type: file.type, data: await readAsDataURL(file) };
      } else if (init.file) d.file = init.file;
    }
    closeModal(); onSave(d);
  };
  $('#modal').classList.add('open');
}
function closeModal() { $('#modal').classList.remove('open'); }

const readAsDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

function MOVE(id, type) {
  const s = byId('supplies', id); if (!s) return;
  openForm(`${type === 'entrada' ? 'Entrada' : 'Saída'}: ${s.name}`, [
    { name: 'quantity', label: 'Quantidade', type: 'number', required: 1 }, { name: 'date', label: 'Data', type: 'date' },
    { name: 'note', label: 'Observação', full: 1 }
  ], { date: today() }, d => {
    const q = Number(d.quantity) || 0;
    const nq = Math.max(0, (s.quantity || 0) + (type === 'entrada' ? q : -q));
    const mv = { id: uid(), supply_id: id, supply_name: s.name, type, quantity: q, date: d.date || today(), note: d.note || '' };
    DB.movements.push(mv);
    audit('movements', type === 'entrada' ? 'Entrada' : 'Saída', { ...mv, id: mv.id }, []);
    save('supplies', { ...s, quantity: nq }, true);
    audit('supplies', 'Movimentado', s, [{ field: 'quantidade', from: s.quantity, to: nq }]);
    NOTICE = stockAlert(s, nq) || null;
    go();
  });
}
function DELMOVE(id) {
  const m = byId('movements', id); if (!m) return;
  const s = byId('supplies', m.supply_id);
  if (s) save('supplies', { ...s, quantity: Math.max(0, (s.quantity || 0) + (m.type === 'entrada' ? -m.quantity : m.quantity)) }, true);
  removeRec('movements', id);
  go();
}

/* ============ planilha (Excel / Sheets) ============ */
const xesc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cellXML(v) {
  if (v === undefined || v === null) v = '';
  if (typeof v === 'number') return `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell><Data ss:Type="String">${xesc(typeof v === 'boolean' ? String(v) : (typeof v === 'object' ? JSON.stringify(v) : v))}</Data></Cell>`;
}
function exportXLS() {
  const ns = 'urn:schemas-microsoft-com:office:spreadsheet';
  const sheets = Object.entries(SCHEMA).map(([ent, sc]) => {
    const head = `<Row>${sc.cols.map(c => `<Cell ss:StyleID="h"><Data ss:Type="String">${xesc(c)}</Data></Cell>`).join('')}</Row>`;
    const src = ent === 'audit' ? DB.audit : DB[ent];
    const rows = src.map(r => `<Row>${sc.cols.map(c => cellXML(c === 'changes' ? (r.changes || []).map(x => `${x.field}: ${x.from} -> ${x.to}`).join(' | ') : c === 'anexo_nome' ? (r.file ? r.file.name : '') : r[c])).join('')}</Row>`).join('');
    return `<Worksheet ss:Name="${xesc(sc.sheet)}"><Table>${head}${rows}</Table></Worksheet>`;
  });
  const cfg = `<Worksheet ss:Name="Config"><Table><Row><Cell ss:StyleID="h"><Data ss:Type="String">chave</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">valor</Data></Cell></Row>${Object.entries(DB.settings).map(([k, v]) => `<Row>${cellXML(k)}${cellXML(v)}</Row>`).join('')}</Table></Worksheet>`;
  const xml = `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="${ns}" xmlns:ss="${ns}"><Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#1B3B6F" ss:Pattern="Solid"/></Style></Styles>${sheets.join('')}${cfg}</Workbook>`;
  download(new Blob([xml], { type: 'application/vnd.ms-excel' }), 'ALB-CLIN-backup.xls');
}
async function importXLS(file) {
  const doc = new DOMParser().parseFromString(await file.text(), 'text/xml');
  const ns = 'urn:schemas-microsoft-com:office:spreadsheet';
  const wss = [...doc.getElementsByTagNameNS(ns, 'Worksheet')];
  const rowsOf = ws => [...ws.getElementsByTagNameNS(ns, 'Row')].map(row => [...row.getElementsByTagNameNS(ns, 'Data')].map(d => d.textContent));
  const next = {};
  for (const [ent, sc] of Object.entries(SCHEMA)) {
    if (ent === 'audit') continue;
    const ws = wss.find(w => w.getAttributeNS(ns, 'Name') === sc.sheet); if (!ws) continue;
    next[ent] = rowsOf(ws).slice(1).map(vals => {
      const o = {};
      sc.cols.forEach((c, i) => {
        let v = vals[i] ?? '';
        if ((sc.bool || []).includes(c)) v = v === 'true';
        else if (sc.num.includes(c)) v = v === '' ? undefined : Number(v);
        o[c] = v === '' ? undefined : v;
      });
      return o;
    }).filter(o => o.id);
  }
  const cfg = wss.find(w => w.getAttributeNS(ns, 'Name') === 'Config');
  if (cfg) {
    const s = { ...DB.settings };
    rowsOf(cfg).slice(1).forEach(([k, v]) => { if (k) s[k] = k === 'fee' ? Number(v) : v; });
    DB.settings = s;
  }
  if (!Object.keys(next).length) throw new Error('Planilha sem as abas do ALB CLIN.');
  const hist = wss.find(w => w.getAttributeNS(ns, 'Name') === SCHEMA.audit.sheet);
  const oldAudit = DB.audit;
  DB = { ...DB, ...next };
  DB.audit = oldAudit;
  if (hist) {
    const imp = rowsOf(hist).slice(1).map(v => ({ id: v[0], ts: v[1], ent: v[2], rid: v[3], label: v[4], action: v[5], changes: [] })).filter(h => h.id);
    const ids = new Set(oldAudit.map(h => h.id));
    DB.audit = [...oldAudit, ...imp.filter(h => !ids.has(h.id))];
  }
  go();
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

/* ============ navegação e eventos ============ */
function renderNav() {
  const groups = { 1: 'nav1', 2: 'nav2', 3: 'nav3', 4: 'nav4' };
  for (const g in groups) {
    $('#' + groups[g]).innerHTML = NAV.filter(n => n[3] == g).map(([k, l, ic]) =>
      `<a href="#${k}" class="${(cur === k || (cur === 'ficha' && k === 'pacientes')) ? 'on' : ''}"><span class="ic">${ic}</span>${l}</a>`).join('');
  }
}
function logoUI() {
  const img = $('#logoImg'), hint = $('#logoHint');
  if (img.complete && img.naturalWidth === 0) LOGO = 'missing';
  const show = LOGO === 'file';
  img.style.display = show ? 'block' : 'none';
  hint.style.display = show ? 'none' : 'block';
}
function logoMissing() { LOGO = 'missing'; logoUI(); }
function globalSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) return;
  const p = DB.patients.find(x => x.name.toLowerCase().includes(q));
  if (p) { FICHA = p.id; FTAB = 'dados'; location.hash = '#ficha'; return; }
  const d = DB.professionals.find(x => x.name.toLowerCase().includes(q));
  if (d) { location.hash = '#doutoras'; return; }
  const c = DB.insurers.find(x => x.name.toLowerCase().includes(q));
  if (c) location.hash = '#convenios';
}
function go() {
  cur = (location.hash || '#painel').slice(1); if (!V[cur]) cur = 'painel';
  const crumbKey = cur === 'ficha' ? 'pacientes' : cur;
  $('#crumb').innerHTML = `ALB CLIN &nbsp;/&nbsp; <b style="color:var(--fg)">${esc(TITLE[crumbKey] || '')}</b>`;
  renderNav();
  $('#content').innerHTML = V[cur]();
  if (cur === 'pacientes') renderPList();
  if (document.activeElement && document.activeElement.id === 'psearch') { /* mantém foco */ }
  logoUI();
  persist();
}
window.addEventListener('hashchange', () => { NOTICE = null; go(); });

document.addEventListener('click', e => {
  if (e.target.closest('#menu')) return;
  $('#menu').classList.remove('open');
  if (e.target.closest('[data-close]')) return closeModal();
  if (e.target.closest('[data-hclose]')) return $('#hmodal').classList.remove('open');
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, ent, id, type, to } = b.dataset;
  if (act === 'goto') return (location.hash = '#' + to);
  if (act === 'anexo') { const n = byId('invoices', id); if (n && n.file) { const a = document.createElement('a'); a.href = n.file.data; a.download = n.file.name; a.click(); } return; }
  if (act === 'new') return FORMS[ent](null);
  if (act === 'edit') return FORMS[ent](byId(ent, id));
  if (act === 'hist') return openHist(ent, id);
  if (act === 'del') { if (!confirm('Excluir este registro? A exclusão ficará registrada no histórico.')) return; removeRec(ent, id); return go(); }
  if (act === 'done') { const w = byId('waitlist', id); if (w) removeRec('waitlist', id); return go(); }
  if (act === 'paid') { const x = byId('cash', id); if (x) save('cash', { ...x, status: 'pago', date: today() }); return go(); }
  if (act === 'ficha') { FICHA = id; FTAB = 'dados'; location.hash = '#ficha'; return go(); }
  if (act === 'recibo') { const c = b.dataset.appt === '1' ? cashList().find(x => x.id === id) : byId('cash', id); if (c) recibo(c); return; }
  if (act === 'move') return MOVE(id, type);
  if (act === 'delmove') return DELMOVE(id);
});
$('#mClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#hmodal').addEventListener('click', e => { if (e.target.id === 'hmodal') e.target.classList.remove('open'); });

$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('open'); };
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  const m = b.dataset.m;
  if (m === 'theme') {
    document.body.classList.toggle('dark');
    $('#themeBtn').textContent = document.body.classList.contains('dark') ? 'Tema claro' : 'Tema escuro';
  }
  if (m === 'fs') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  if (m === 'print') window.print();
  if (m === 'xls') exportXLS();
  if (m === 'sample' && confirm('Substituir os dados atuais pelos dados de exemplo?')) { seed(); go(); }
  if (m === 'clear' && confirm('Apagar todos os dados?')) { DB = emptyDB(); go(); }
});
$('#impFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { await importXLS(f); alert('Backup importado.'); }
  catch (err) { alert('Não foi possível importar: ' + err.message); }
  e.target.value = '';
};

document.addEventListener('fullscreenchange', () => {
  $('#fsBtn').textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia';
});
$('#logoBox').onclick = () => $('#logoFile').click();
$('#logoFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    LOGO = 'file'; $('#logoImg').src = r.result;
    try { localStorage.setItem(LOGO_KEY, r.result); } catch (err) { alert('Logotipo grande demais para salvar. Use uma imagem menor.'); }
    logoUI();
  };
  r.readAsDataURL(f);
  e.target.value = '';
};

/* ============ persistência (salva no navegador deste computador) ============ */
const STORE_KEY = 'alb-clin-dados-v5', LOGO_KEY = 'alb-clin-logo-v5';
let storeWarned = false;
const PREFS_KEY = 'alb-clin-prefs-v5';
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ dark: document.body.classList.contains('dark'), F, caixaType, NF, HQ })); } catch (err) {}
}
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null');
    if (!p) return;
    if (p.dark) document.body.classList.add('dark');
    if (p.F) Object.assign(F, p.F);
    if (p.caixaType) caixaType = p.caixaType;
    if (p.NF) NF = { ...NF, ...p.NF };
    if (p.HQ) HQ = { ...HQ, ...p.HQ };
  } catch (err) {}
  $('#themeBtn').textContent = document.body.classList.contains('dark') ? 'Tema claro' : 'Tema escuro';
}
function persist() {
  savePrefs();
  queuePush();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch (err) { if (!storeWarned) { storeWarned = true; alert('Não foi possível salvar as informações neste navegador (espaço cheio). Evite anexos muito grandes.'); } }
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    DB = { ...emptyDB(), ...JSON.parse(raw) };
    return true;
  } catch (err) { return false; }
}
try { const sl = localStorage.getItem(LOGO_KEY); if (sl) $('#logoImg').src = sl; } catch (err) {}
loadPrefs();
if (!loadSaved()) seed();
if (!location.hash) location.hash = '#painel';
go();
boot();

/* ============ sincronização com o servidor (Netlify Functions + Blobs) ============ */
const API = '/.netlify/functions/state';
let pushTimer = null, booted = false;
function clinicKey() {
  let k = sessionStorage.getItem('alb-clin-key');
  if (!k) { k = prompt('Senha de acesso da clínica:') || ''; if (k) sessionStorage.setItem('alb-clin-key', k); }
  return k;
}
async function boot() {
  try {
    const r = await fetch(API, { headers: { 'x-clinic-key': clinicKey() } });
    if (r.status === 401) { sessionStorage.removeItem('alb-clin-key'); alert('Senha incorreta. Recarregue a página para tentar de novo.'); return; }
    if (r.ok) {
      const remote = await r.json();
      if (remote && remote.data) { DB = { ...emptyDB(), ...remote.data }; go(); }
      else await pushRemote();
    }
  } catch (err) { /* sem conexão: usa o cache deste navegador */ }
  booted = true;
}
function queuePush() {
  if (!booted) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 800);
}
async function pushRemote() {
  try {
    const r = await fetch(API, { method: 'PUT', headers: { 'content-type': 'application/json', 'x-clinic-key': sessionStorage.getItem('alb-clin-key') || '' }, body: JSON.stringify({ data: DB, savedAt: new Date().toISOString() }) });
    if (r.status === 401) { sessionStorage.removeItem('alb-clin-key'); alert('Senha incorreta: as alterações não foram salvas no servidor.'); }
  } catch (err) { /* tenta de novo na próxima alteração */ }
}
</script>
